  /api/v1/professional/projects/{projectId}/research/questions:
    post:
      operationId: createResearchQuestion
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
