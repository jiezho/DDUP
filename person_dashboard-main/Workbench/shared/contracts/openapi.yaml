        project_id: { $ref: "#/components/schemas/NullableUuid" }
        filename:
          type: string
          minLength: 1
          maxLength: 180
          pattern: "^[^/\\\\\\x00-\\x1F\\x7F]+\\.(md|markdown)$"
        title: { type: string, minLength: 1, maxLength: 200 }
        content: { type: string, minLength: 1, maxLength: 1000000 }
    ContextSearch:
      type: object
      additionalProperties: false
