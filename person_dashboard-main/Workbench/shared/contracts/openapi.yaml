openapi: 3.1.0
info:
  title: Personal AI Workbench Local API
  version: 1.11.0
  description: >-
    Local-loopback MVP contract. Foundation session/security and the durable
    project, milestone, task, manual discussion-to-decision, explicit text/link
    capture, daily focus/review, controlled Markdown source intake, and authorized
    context full-text search, explicit context-package slices, and a deterministic
    local Native Runtime lifecycle are implemented. The Native Runtime persists only
    scope digests and safe replay events; it generates no answer. Its only Runtime-callable
    tool creates a non-authoritative task candidate. Applying that candidate requires a separate
    local L2 approval with a scope digest and creates no external effect. Run history now
    includes bounded JSON replay, recoverable SSE, durable Workbench checkpoints, safe
    restart failure convergence, and retry lineage for eligible zero-tool runs. Harness remains
    disconnected; its registry descriptor exposes only a zero-dependency stdio JSON-RPC protocol
    preflight with no health or Run availability.
    A default-off protected hybrid-search path may
    call a token-authenticated fixed-identity loopback sidecar after authorization and automatically
    falls back to FTS5; it does not generate answers. Other product domains remain out of scope.
servers:
  - url: http://127.0.0.1:8787
paths:
  /api/health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Minimal service health without business data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/session/bootstrap:
    post:
      operationId: bootstrapLocalSession
      parameters:
        - in: header
          name: X-Workbench-Bootstrap
          required: true
          schema: { type: string, minLength: 32 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/session:
    get:
      operationId: getLocalSession
      security: [{ localSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      operationId: revokeLocalSession
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/system/capabilities:
    get:
      operationId: getCapabilities
      security: [{ localSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/spaces:
    get:
      operationId: listSpaces
      security: [{ localSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/spaces/{spaceId}:
    get:
      operationId: getSpace
      security: [{ localSession: [] }]
      parameters:
        - in: path
          name: spaceId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/projects:
    get:
      operationId: listProjects
      security: [{ localSession: [] }]
      parameters:
        - in: query
          name: space_id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/ProjectStatus" }
        - in: query
          name: template_type
          schema: { $ref: "#/components/schemas/ProjectTemplate" }
        - in: query
          name: cursor
          schema: { type: string, maxLength: 512 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createProject
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectCreate" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}:
    get:
      operationId: getProject
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateProject
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectPatch" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProject
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/transitions:
    post:
      operationId: transitionProject
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectTransition" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/restore:
    post:
      operationId: restoreProject
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/milestones:
    get:
      operationId: listMilestones
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createMilestone
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MilestoneCreate" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/milestones/{milestoneId}:
    patch:
      operationId: updateMilestone
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/MilestoneId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MilestonePatch" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMilestone
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/MilestoneId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/tasks:
    get:
      operationId: listTasks
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createTask
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskCreate" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/tasks/{taskId}:
    get:
      operationId: getTask
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateTask
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskPatch" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteTask
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/tasks/{taskId}/transitions:
    post:
      operationId: transitionTask
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskTransition" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/discussions:
    get:
      operationId: listDiscussions
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createDiscussion
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscussionCreate" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/discussions/{discussionId}/entries:
    get:
      operationId: listDiscussionEntries
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/DiscussionId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createDiscussionEntry
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/DiscussionId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscussionEntryCreate" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/decisions:
    get:
      operationId: listDecisions
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/discussions/{discussionId}/conversions:
    post:
      operationId: convertDiscussionToDecisionAndTask
      description: >-
        Explicit owner-confirmed atomic command. It resolves one open discussion,
        accepts one decision, creates one task, and records their link. It is not an AI approval.
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/DiscussionId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscussionConversion" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/captures:
    get:
      operationId: listCaptures
      security: [{ localSession: [] }]
      parameters:
        - in: query
          name: space_id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: project_id
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { type: string, enum: [inbox, processed, archived], default: inbox }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createCapture
      description: >-
        Stores explicit text or http/https link metadata in the local inbox.
        The endpoint never fetches the URL and never promotes the capture to long-term knowledge.
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaptureCreate" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/captures/{captureId}/transitions:
    post:
      operationId: transitionCapture
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CaptureId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaptureTransition" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/daily/{date}:
    get:
      operationId: getDailySnapshot
      description: >-
        Returns project task truth, at most three saved focus references, and the
        explicit user-authored review for one local date. It does not copy tasks or generate AI text.
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/DailyDate"
        - in: query
          name: space_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/daily-plans/{date}:
    put:
      operationId: saveDailyPlan
      description: Saves up to three references to project tasks; task records remain owned by the project workspace.
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/DailyDate"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/OptionalIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DailyPlanSave" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/daily-reviews/{date}:
    put:
      operationId: saveDailyReview
      description: Stores only the user's explicit review fields; no AI generation or silent rewriting occurs.
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/DailyDate"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/OptionalIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DailyReviewSave" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/sources:
    get:
      operationId: listSources
      description: Lists source metadata only after space/project authorization; storage paths and source bodies are not returned.
      security: [{ localSession: [] }]
      parameters:
        - in: query
          name: space_id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: project_id
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { type: string, enum: [ready, archived, failed], default: ready }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/sources/imports/markdown:
    post:
      operationId: importMarkdownSource
      description: >-
        Accepts one explicit Markdown payload from the browser, writes immutable content-addressed
        bytes under the controlled source root, creates Source/SourceVersion/Document, and indexes
        normalized text. It never accepts a client path, fetches a URL, invokes AI, or parses XLSX.
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkdownSourceImport" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/context/search:
    post:
      operationId: searchAuthorizedContext
      description: >-
        Read-only search command. Space/project/type/date authorization filters are applied in the
        database query before titles, snippets, counts, locators, or document text are returned or sent
        to a local sidecar. FTS5 trigram with a bounded short-query fallback remains the default. An
        explicitly enabled experimental path can add BGE-M3 stable-chunk dense ranking and RRF, with
        deterministic intent refusal, a synthetic-calibrated 0.50 evidence threshold, fixed model
        identity, exact SourceVersion character locators, and automatic FTS fallback. It never produces
        a generated answer and does not include reranking; the experimental feature remains default-off.
      security: [{ localSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContextSearch" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/context/packages:
    get:
      operationId: listContextPackages
      description: Lists active, expired, or archived package metadata in one authorized space; it does not resolve item bodies.
      security: [{ localSession: [] }]
      parameters:
        - in: query
          name: space_id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { type: string, enum: [active, expired, archived], default: active }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createContextPackage
      description: Creates an empty explicit allowlist with a declared purpose and optional UTC-normalized expiry.
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContextPackageCreate" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/context/packages/{packageId}:
    get:
      operationId: getContextPackage
      description: Resolves only explicit items that remain authorized and version-valid; unavailable entries are returned as excluded without body text.
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: packageId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: space_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/context/packages/{packageId}/items:
    post:
      operationId: addContextPackageItem
      description: Adds one authorized object or a fixed SourceVersion character range; no excerpt or body is persisted in the package item.
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: packageId, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContextPackageItemAdd" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/context/packages/{packageId}/items/{itemId}:
    delete:
      operationId: removeContextPackageItem
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: packageId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: itemId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: space_id, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/context/packages/{packageId}/transitions:
    post:
      operationId: archiveContextPackage
      description: Archives the package; archived packages resolve no body text for later runs.
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: packageId, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContextPackageArchive" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/runtimes:
    get:
      operationId: listRuntimes
      description: Lists the implemented Native adapter, disconnected Harness protocol-preflight metadata, and the disconnected Hermes candidate without probing either external runtime.
      security: [{ localSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v1/runtimes/{runtimeKey}/health:
    get:
      operationId: getRuntimeHealth
      description: Returns a redacted health snapshot only for an available adapter; disconnected candidates return RUNTIME_UNAVAILABLE.
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: runtimeKey, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/runs:
    get:
      operationId: listAgentRuns
      description: Lists safe run metadata inside one authorized space.
      security: [{ localSession: [] }]
      parameters:
        - { in: query, name: space_id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { type: string, enum: [queued, running, succeeded, failed, cancelled] } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAgentRun
      description: Starts the deterministic local Native lifecycle against one active, version-matched ContextPackage. It produces no model answer; an explicitly supplied Task Candidate may use the single registered L1 candidate tool.
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentRunCreate" }
      responses:
        "202": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/runs/{runId}:
    get:
      operationId: getAgentRun
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: runId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: space_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/runs/{runId}/events:
    get:
      operationId: replayAgentRunEvents
      description: Returns a bounded JSON replay page after a sequence number.
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: runId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: space_id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: after_seq, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/runs/{runId}/events/stream:
    get:
      operationId: streamAgentRunEvents
      description: Streams authorized, redacted Run events as SSE and resumes after Last-Event-ID; disconnecting never cancels the Run.
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: runId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: space_id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: after_seq, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
        - { in: header, name: Last-Event-ID, required: false, schema: { type: string, pattern: "^[0-9]+$" } }
      responses:
        "200":
          description: Recoverable event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/runs/{runId}/checkpoints:
    get:
      operationId: listAgentRunCheckpoints
      description: Lists Workbench-verifiable checkpoints without prompt text, secrets, or Runtime-private state bodies.
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: runId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: space_id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: after_seq, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/runs/{runId}/cancel:
    post:
      operationId: cancelAgentRun
      description: Idempotently cancels a non-terminal Native run using optimistic versioning.
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: runId, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentRunCancel" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/runs/{runId}/retry:
    post:
      operationId: retryAgentRun
      description: Creates one linked Run only when the failed source is explicitly retryable, used no tools, and its ContextPackage version remains active.
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: runId, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentRunRetry" }
      responses:
        "202": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/tools:
    get:
      operationId: listRegisteredTools
      description: Lists the fixed local Tool Gateway allowlist and action levels; it exposes no executable credentials or dynamic installation.
      security: [{ localSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v1/candidates:
    get:
      operationId: listCandidates
      description: Lists non-authoritative candidates inside one authorized space.
      security: [{ localSession: [] }]
      parameters:
        - { in: query, name: space_id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { type: string, enum: [pending, approved, rejected, applied, failed] } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/candidates/{candidateId}:
    get:
      operationId: getCandidate
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: candidateId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: space_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/candidates/{candidateId}/approvals:
    post:
      operationId: requestCandidateApproval
      description: Creates one expiring L2 approval bound to the task proposal digest; it does not apply the candidate.
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: candidateId, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CandidateApprovalRequest" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/candidates/{candidateId}/apply:
    post:
      operationId: applyTaskCandidate
      description: Revalidates candidate bytes, approval scope, expiry, space, project state and candidate version before creating one local task.
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: candidateId, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CandidateApply" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/approvals:
    get:
      operationId: listApprovals
      security: [{ localSession: [] }]
      parameters:
        - { in: query, name: space_id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { type: string, enum: [pending, approved, rejected, expired, cancelled] } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v1/approvals/{approvalId}:
    get:
      operationId: getApproval
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: approvalId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: space_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/approvals/{approvalId}/resolve:
    post:
      operationId: resolveApproval
      description: Records an explicit local-owner approve or reject decision; approval is still separate from candidate application.
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: approvalId, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalResolve" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    localSession:
      type: apiKey
      in: cookie
      name: workbench_session
  parameters:
    CsrfToken:
      in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string, minLength: 32 }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 16, maxLength: 200, pattern: "^[A-Za-z0-9._~-]+$" }
    IfMatch:
      in: header
      name: If-Match
      required: true
      schema: { type: string, pattern: '^"v[1-9][0-9]*"$' }
    OptionalIfMatch:
      in: header
      name: If-Match
      required: false
      description: Omit when creating the date record; send the current version when updating it.
      schema: { type: string, pattern: '^"v[1-9][0-9]*"$' }
    ProjectId:
      in: path
      name: projectId
      required: true
      schema: { type: string, format: uuid }
    MilestoneId:
      in: path
      name: milestoneId
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      in: path
      name: taskId
      required: true
      schema: { type: string, format: uuid }
    DiscussionId:
      in: path
      name: discussionId
      required: true
      schema: { type: string, format: uuid }
    CaptureId:
      in: path
      name: captureId
      required: true
      schema: { type: string, format: uuid }
    DailyDate:
      in: path
      name: date
      required: true
      schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
  responses:
    Success:
      description: Successful envelope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SuccessEnvelope" }
    Error:
      description: Safe error envelope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    AgentRunCreate:
      type: object
      additionalProperties: false
      required: [space_id, context_package_id, context_package_version, goal]
      properties:
        space_id: { type: string, format: uuid }
        context_package_id: { type: string, format: uuid }
        context_package_version: { type: integer, minimum: 1 }
        runtime_key: { type: string, enum: [native-v1], default: native-v1 }
        profile_key: { type: string, enum: [native-safe-readonly-v1], default: native-safe-readonly-v1 }
        profile_version: { type: integer, enum: [1], default: 1 }
        goal: { type: string, minLength: 1, maxLength: 2000 }
        task_candidate:
          type: object
          additionalProperties: false
          required: [project_id, title]
          properties:
            project_id: { type: string, format: uuid }
            title: { type: string, minLength: 1, maxLength: 240 }
            description: { type: string, maxLength: 20000, default: "" }
            priority: { type: string, enum: [low, normal, high, urgent], default: normal }
            due_date: { type: [string, "null"], pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        budget:
          type: object
          additionalProperties: false
          properties:
            max_steps: { type: integer, minimum: 1, maximum: 10, default: 3 }
            max_tool_calls: { type: integer, minimum: 0, maximum: 1, default: 0 }
    AgentRunCancel:
      type: object
      additionalProperties: false
      required: [space_id]
      properties:
        space_id: { type: string, format: uuid }
        reason: { type: string, enum: [user_requested, budget_stop, superseded], default: user_requested }
    AgentRunRetry:
      type: object
      additionalProperties: false
      required: [space_id]
      properties:
        space_id: { type: string, format: uuid }
    CandidateApprovalRequest:
      type: object
      additionalProperties: false
      required: [space_id]
      properties:
        space_id: { type: string, format: uuid }
        reason_code: { type: string, enum: [apply_task_candidate], default: apply_task_candidate }
    CandidateApply:
      type: object
      additionalProperties: false
      required: [space_id, approval_id]
      properties:
        space_id: { type: string, format: uuid }
        approval_id: { type: string, format: uuid }
    ApprovalResolve:
      type: object
      additionalProperties: false
      required: [space_id, decision]
      properties:
        space_id: { type: string, format: uuid }
        decision: { type: string, enum: [approve, reject] }
    ProjectStatus:
      type: string
      enum: [draft, active, paused, completed, archived]
    ProjectTemplate:
      type: string
      enum: [general, research, ai_exploration, frontier_tracking, learning]
    LocalDate:
      type: [string, "null"]
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
    ProjectCreate:
      type: object
      additionalProperties: false
      required: [space_id, name, template_type]
      properties:
        space_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        summary: { type: string, maxLength: 2000, default: "" }
        template_type: { $ref: "#/components/schemas/ProjectTemplate" }
        start_date: { $ref: "#/components/schemas/LocalDate" }
        target_date: { $ref: "#/components/schemas/LocalDate" }
        context_policy: { type: string, enum: [project_only, space_allowed], default: project_only }
        color_token: { type: string, enum: [sky, cyan, blue, teal, indigo], default: sky }
    ProjectPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        summary: { type: string, maxLength: 2000 }
        start_date: { $ref: "#/components/schemas/LocalDate" }
        target_date: { $ref: "#/components/schemas/LocalDate" }
        context_policy: { type: string, enum: [project_only, space_allowed] }
        color_token: { type: string, enum: [sky, cyan, blue, teal, indigo] }
    ProjectTransition:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [activate, pause, complete, archive, reopen] }
    MilestoneStatus:
      type: string
      enum: [planned, active, completed, cancelled]
    MilestoneCreate:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        target_date: { $ref: "#/components/schemas/LocalDate" }
        sort_order: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
    MilestonePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        status: { $ref: "#/components/schemas/MilestoneStatus" }
        target_date: { $ref: "#/components/schemas/LocalDate" }
        sort_order: { type: integer, minimum: 0, maximum: 1000000 }
    TaskStatus:
      type: string
      enum: [inbox, planned, in_progress, blocked, done, cancelled]
    NullableUuid:
      type: [string, "null"]
      format: uuid
    NullableDateTime:
      type: [string, "null"]
      format: date-time
    TaskCreate:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 240 }
        description: { type: string, maxLength: 20000, default: "" }
        priority: { type: string, enum: [low, normal, high, urgent], default: normal }
        due_at: { $ref: "#/components/schemas/NullableDateTime" }
        due_date: { $ref: "#/components/schemas/LocalDate" }
        milestone_id: { $ref: "#/components/schemas/NullableUuid" }
        parent_task_id: { $ref: "#/components/schemas/NullableUuid" }
    TaskPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 240 }
        description: { type: string, maxLength: 20000 }
        priority: { type: string, enum: [low, normal, high, urgent] }
        due_at: { $ref: "#/components/schemas/NullableDateTime" }
        due_date: { $ref: "#/components/schemas/LocalDate" }
        milestone_id: { $ref: "#/components/schemas/NullableUuid" }
        parent_task_id: { $ref: "#/components/schemas/NullableUuid" }
    TaskTransition:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [plan, start, block, complete, cancel, reopen] }
    DiscussionCreate:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
    DiscussionEntryCreate:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 20000 }
    DiscussionConversion:
      type: object
      additionalProperties: false
      required: [decision_title, statement, task_title]
      properties:
        decision_title: { type: string, minLength: 1, maxLength: 200 }
        statement: { type: string, minLength: 1, maxLength: 20000 }
        rationale: { type: string, maxLength: 20000, default: "" }
        task_title: { type: string, minLength: 1, maxLength: 240 }
        task_priority: { type: string, enum: [low, normal, high, urgent], default: normal }
        task_due_date: { $ref: "#/components/schemas/LocalDate" }
        milestone_id: { $ref: "#/components/schemas/NullableUuid" }
    CaptureCreate:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, space_id, title, body]
          properties:
            kind: { const: text }
            space_id: { type: string, format: uuid }
            project_id: { $ref: "#/components/schemas/NullableUuid" }
            title: { type: string, minLength: 1, maxLength: 200 }
            body: { type: string, minLength: 1, maxLength: 20000 }
        - type: object
          additionalProperties: false
          required: [kind, space_id, title, canonical_uri]
          properties:
            kind: { const: link }
            space_id: { type: string, format: uuid }
            project_id: { $ref: "#/components/schemas/NullableUuid" }
            title: { type: string, minLength: 1, maxLength: 200 }
            canonical_uri: { type: string, format: uri, maxLength: 2048, pattern: "^https?://" }
    CaptureTransition:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [process, archive, reopen] }
    DailyPlanSave:
      type: object
      additionalProperties: false
      required: [space_id, task_ids]
      properties:
        space_id: { type: string, format: uuid }
        task_ids:
          type: array
          maxItems: 3
          uniqueItems: true
          items: { type: string, format: uuid }
    DailyReviewSave:
      type: object
      additionalProperties: false
      required: [space_id]
      properties:
        space_id: { type: string, format: uuid }
        summary: { type: string, maxLength: 10000, default: "" }
        wins: { type: string, maxLength: 10000, default: "" }
        blockers: { type: string, maxLength: 10000, default: "" }
        next_focus: { type: string, maxLength: 10000, default: "" }
    MarkdownSourceImport:
      type: object
      additionalProperties: false
      required: [space_id, filename, content]
      properties:
        space_id: { type: string, format: uuid }
        project_id: { $ref: "#/components/schemas/NullableUuid" }
        filename:
          type: string
          minLength: 1
          maxLength: 180
          pattern: "^[^/\\\\\\x00-\\x1F\\x7F]+\\.(md|markdown)$"
        title: { type: string, minLength: 1, maxLength: 200 }
        content: { type: string, minLength: 1, maxLength: 1000000 }
    ContextSearch:
      type: object
      additionalProperties: false
      required: [space_id, q]
      properties:
        space_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        q: { type: string, minLength: 2, maxLength: 200 }
        types:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          default: [project, task, capture, document]
          items: { type: string, enum: [project, task, capture, document] }
        from: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        to: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        limit: { type: integer, minimum: 1, maximum: 50, default: 20 }
    ContextPackageCreate:
      type: object
      additionalProperties: false
      required: [space_id, name, purpose]
      properties:
        space_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        purpose: { type: string, minLength: 1, maxLength: 500 }
        expires_at: { type: [string, "null"], format: date-time, default: null }
    ContextPackageItemAdd:
      type: object
      additionalProperties: false
      required: [space_id, object_type, object_id]
      properties:
        space_id: { type: string, format: uuid }
        object_type: { type: string, enum: [project, task, capture, document] }
        object_id: { type: string, format: uuid }
        source_version_id: { $ref: "#/components/schemas/NullableUuid" }
        start_char: { type: [integer, "null"], minimum: 0, default: null }
        end_char: { type: [integer, "null"], minimum: 1, default: null }
    ContextPackageArchive:
      type: object
      additionalProperties: false
      required: [space_id, action]
      properties:
        space_id: { type: string, format: uuid }
        action: { const: archive }
    SuccessEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, status, data, errors, meta]
      properties:
        request_id: { type: string, format: uuid }
        status: { const: ok }
        data: {}
        errors: { type: array, maxItems: 0 }
        meta:
          type: object
          required: [api_version]
          properties:
            api_version: { const: v1 }
          additionalProperties: true
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, status, data, errors, meta]
      properties:
        request_id: { type: string, format: uuid }
        status: { const: error }
        data: { type: "null" }
        errors:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [code, message, field, retryable]
            properties:
              code: { type: string }
              message: { type: string }
              field: { type: [string, "null"] }
              retryable: { type: boolean }
        meta:
          type: object
          required: [api_version]
          properties:
            api_version: { const: v1 }
          additionalProperties: true
