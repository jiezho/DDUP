      type: object
      additionalProperties: false
      required: [request_id, status, data, errors, meta]
      properties:
        request_id: { type: string, format: uuid }
        status: { const: ok }
        data: {}
        errors: { type: array, maxItems: 0 }
        meta:
          type: object
          required: [api_version]
          properties:
            api_version: { const: v1 }
          additionalProperties: true
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, status, data, errors, meta]
      properties:
        request_id: { type: string, format: uuid }
        status: { const: error }
        data: { type: "null" }
        errors:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [code, message, field, retryable]
            properties:
              code: { type: string }
              message: { type: string }
              field: { type: [string, "null"] }
              retryable: { type: boolean }
        meta:
          type: object
          required: [api_version]
          properties:
            api_version: { const: v1 }
          additionalProperties: true
