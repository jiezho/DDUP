components:
  securitySchemes:
    localSession:
      type: apiKey
      in: cookie
      name: workbench_session
  parameters:
    CsrfToken:
      in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string, minLength: 32 }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 16, maxLength: 200, pattern: "^[A-Za-z0-9._~-]+$" }
    IfMatch:
      in: header
      name: If-Match
      required: true
      schema: { type: string, pattern: '^"v[1-9][0-9]*"$' }
    OptionalIfMatch:
      in: header
      name: If-Match
      required: false
      description: Omit when creating the date record; send the current version when updating it.
      schema: { type: string, pattern: '^"v[1-9][0-9]*"$' }
    ProjectId:
      in: path
      name: projectId
      required: true
      schema: { type: string, format: uuid }
    MilestoneId:
      in: path
      name: milestoneId
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      in: path
      name: taskId
      required: true
      schema: { type: string, format: uuid }
    DiscussionId:
      in: path
      name: discussionId
      required: true
      schema: { type: string, format: uuid }
    CaptureId:
      in: path
      name: captureId
      required: true
      schema: { type: string, format: uuid }
    DailyDate:
      in: path
      name: date
      required: true
      schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
  responses:
    Success:
      description: Successful envelope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SuccessEnvelope" }
    Error:
      description: Safe error envelope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    ResearchQuestionCreate:
      type: object
      additionalProperties: false
      required: [title, problem_statement, hypothesis, success_criteria]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        problem_statement: { type: string, minLength: 1, maxLength: 10000 }
        hypothesis: { type: string, minLength: 1, maxLength: 10000 }
        success_criteria: { type: string, minLength: 1, maxLength: 10000 }
    ResearchExperimentCreate:
      type: object
      additionalProperties: false
      required: [title, method, variables, expected_outcome]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        method: { type: string, minLength: 1, maxLength: 20000 }
        variables: { type: string, minLength: 1, maxLength: 10000 }
        expected_outcome: { type: string, minLength: 1, maxLength: 10000 }
    ResearchResultRecord:
      type: object
      additionalProperties: false
      required: [result_summary, decision, follow_up_task_title]
      properties:
        result_summary: { type: string, minLength: 1, maxLength: 20000 }
        decision: { enum: [continue, stop] }
        follow_up_task_title: { type: [string, "null"], maxLength: 240 }
    ResearchClaimCreate:
      type: object
      additionalProperties: false
      required: [experiment_id, statement, evidence_direction, evidence_strength, evidence]
      properties:
        experiment_id: { type: string, format: uuid }
        statement: { type: string, minLength: 1, maxLength: 10000 }
        evidence_direction: { enum: [supports, challenges, mixed] }
        evidence_strength: { enum: [weak, moderate, strong] }
        evidence:
          type: object
          additionalProperties: false
          required: [source_id, source_version_id, document_id, start_char, end_char]
          properties:
            source_id: { type: string, format: uuid }
            source_version_id: { type: string, format: uuid }
            document_id: { type: string, format: uuid }
            start_char: { type: integer, minimum: 0 }
            end_char: { type: integer, minimum: 1 }
    AiOpportunityCreate:
      type: object
      additionalProperties: false
      required: [title, problem_statement, target_user, value_hypothesis, feasibility_hypothesis]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        problem_statement: { type: string, minLength: 1, maxLength: 10000 }
        target_user: { type: string, minLength: 1, maxLength: 2000 }
        value_hypothesis: { type: string, minLength: 1, maxLength: 10000 }
        feasibility_hypothesis: { type: string, minLength: 1, maxLength: 10000 }
    AiExperimentCreate:
      type: object
      additionalProperties: false
      required: [title, evaluation_method, metric_name, baseline_value, target_value]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        evaluation_method: { type: string, minLength: 1, maxLength: 10000 }
        metric_name: { type: string, minLength: 1, maxLength: 200 }
        baseline_value: { type: [number, "null"] }
        target_value: { type: number }
    AiResultRecord:
      type: object
      additionalProperties: false
      required: [observed_value, evidence_summary, decision, follow_up_task_title]
      properties:
        observed_value: { type: number }
        evidence_summary: { type: string, minLength: 1, maxLength: 20000 }
        decision: { enum: [go, stop] }
        follow_up_task_title: { type: [string, "null"], maxLength: 240 }
    RadarTopicCreate:
      type: object
      additionalProperties: false
      required: [title, domain, synthesis, maturity, limitations, impact_summary, disposition, next_review_date]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        domain: { enum: [ai, it, energy, research_methods, custom] }
        synthesis: { type: string, minLength: 1, maxLength: 20000 }
        maturity: { enum: [emerging, experimental, early_adoption, maturing, established] }
        limitations: { type: string, minLength: 1, maxLength: 10000 }
        impact_summary: { type: string, minLength: 1, maxLength: 10000 }
        disposition: { enum: [track, validate, ignore] }
        next_review_date: { type: [string, "null"], format: date }
    RadarTopicReview:
      type: object
      additionalProperties: false
      required: [maturity, limitations, impact_summary, disposition, next_review_date, follow_up_task_title]
      properties:
        maturity: { enum: [emerging, experimental, early_adoption, maturing, established] }
        limitations: { type: string, minLength: 1, maxLength: 10000 }
        impact_summary: { type: string, minLength: 1, maxLength: 10000 }
        disposition: { enum: [track, validate, ignore] }
        next_review_date: { type: [string, "null"], format: date }
        follow_up_task_title: { type: [string, "null"], maxLength: 240 }
    RadarSignalCreate:
      type: object
      additionalProperties: false
      required: [summary, classification, published_on, evidence]
      properties:
        summary: { type: string, minLength: 1, maxLength: 10000 }
        classification: { enum: [primary_fact, secondary_report, opinion, inference] }
        published_on: { type: [string, "null"], format: date }
        evidence:
          type: object
          additionalProperties: false
          required: [source_id, source_version_id, document_id, start_char, end_char]
          properties:
            source_id: { type: string, format: uuid }
            source_version_id: { type: string, format: uuid }
            document_id: { type: string, format: uuid }
            start_char: { type: integer, minimum: 0 }
            end_char: { type: integer, minimum: 1 }
    LearningTrackCreate:
      type: object
      additionalProperties: false
      required: [title, category, focus, goal, baseline, success_criteria]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        category: { enum: [english, research_methods, programming_ai, professional, custom] }
        focus: { enum: [academic_reading, academic_writing, daily_speaking, general] }
        goal: { type: string, minLength: 1, maxLength: 10000 }
        baseline: { type: string, minLength: 1, maxLength: 10000 }
        success_criteria: { type: string, minLength: 1, maxLength: 10000 }
    LearningPracticeCreate:
      type: object
      additionalProperties: false
      required: [title, practice_type, planned_for, instructions]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        practice_type: { enum: [reading, writing, speaking, exercise, project, review] }
        planned_for: { type: [string, "null"], format: date }
        instructions: { type: string, minLength: 1, maxLength: 10000 }
    LearningPracticeResult:
      type: object
      additionalProperties: false
      required: [reflection, feedback, self_rating, decision, follow_up_task_title]
      properties:
        reflection: { type: string, minLength: 1, maxLength: 20000 }
        feedback: { type: string, minLength: 1, maxLength: 20000 }
        self_rating: { type: [integer, "null"], minimum: 1, maximum: 5 }
        decision: { enum: [continue, adjust, complete] }
        follow_up_task_title: { type: [string, "null"], maxLength: 240 }
    LearningRoutineCreate:
      type: object
      additionalProperties: false
      required: [title, cadence, target_count]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        cadence: { enum: [daily, weekly] }
        target_count: { type: integer, minimum: 1, maximum: 100 }
    LearningCheckinCreate:
      type: object
      additionalProperties: false
      required: [local_date, completed_count, note]
      properties:
        local_date: { type: string, format: date }
        completed_count: { type: integer, minimum: 0, maximum: 100 }
        note: { type: string, maxLength: 10000 }
    AgentRunCreate:
      type: object
      additionalProperties: false
      required: [space_id, context_package_id, context_package_version, goal]
      properties:
        space_id: { type: string, format: uuid }
        context_package_id: { type: string, format: uuid }
        context_package_version: { type: integer, minimum: 1 }
        runtime_key: { type: string, enum: [native-v1], default: native-v1 }
        profile_key: { type: string, enum: [native-safe-readonly-v1], default: native-safe-readonly-v1 }
        profile_version: { type: integer, enum: [1], default: 1 }
        goal: { type: string, minLength: 1, maxLength: 2000 }
        task_candidate:
          type: object
          additionalProperties: false
          required: [project_id, title]
          properties:
            project_id: { type: string, format: uuid }
            title: { type: string, minLength: 1, maxLength: 240 }
            description: { type: string, maxLength: 20000, default: "" }
            priority: { type: string, enum: [low, normal, high, urgent], default: normal }
            due_date: { type: [string, "null"], pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        budget:
          type: object
          additionalProperties: false
          properties:
            max_steps: { type: integer, minimum: 1, maximum: 10, default: 3 }
            max_tool_calls: { type: integer, minimum: 0, maximum: 1, default: 0 }
    AgentRunCancel:
      type: object
      additionalProperties: false
      required: [space_id]
      properties:
        space_id: { type: string, format: uuid }
        reason: { type: string, enum: [user_requested, budget_stop, superseded], default: user_requested }
    AgentRunRetry:
      type: object
      additionalProperties: false
      required: [space_id]
      properties:
        space_id: { type: string, format: uuid }
    CandidateApprovalRequest:
      type: object
      additionalProperties: false
      required: [space_id]
      properties:
        space_id: { type: string, format: uuid }
        reason_code: { type: string, enum: [apply_task_candidate], default: apply_task_candidate }
    CandidateApply:
      type: object
      additionalProperties: false
      required: [space_id, approval_id]
      properties:
        space_id: { type: string, format: uuid }
        approval_id: { type: string, format: uuid }
    ApprovalResolve:
      type: object
      additionalProperties: false
      required: [space_id, decision]
      properties:
        space_id: { type: string, format: uuid }
        decision: { type: string, enum: [approve, reject] }
    ProjectStatus:
      type: string
      enum: [draft, active, paused, completed, archived]
    ProjectTemplate:
      type: string
      enum: [general, research, ai_exploration, frontier_tracking, learning]
    LocalDate:
      type: [string, "null"]
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
    ProjectCreate:
      type: object
      additionalProperties: false
      required: [space_id, name, template_type]
      properties:
        space_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        summary: { type: string, maxLength: 2000, default: "" }
        template_type: { $ref: "#/components/schemas/ProjectTemplate" }
        start_date: { $ref: "#/components/schemas/LocalDate" }
        target_date: { $ref: "#/components/schemas/LocalDate" }
        context_policy: { type: string, enum: [project_only, space_allowed], default: project_only }
        color_token: { type: string, enum: [sky, cyan, blue, teal, indigo], default: sky }
    ProjectPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        summary: { type: string, maxLength: 2000 }
        start_date: { $ref: "#/components/schemas/LocalDate" }
        target_date: { $ref: "#/components/schemas/LocalDate" }
        context_policy: { type: string, enum: [project_only, space_allowed] }
        color_token: { type: string, enum: [sky, cyan, blue, teal, indigo] }
    ProjectTransition:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [activate, pause, complete, archive, reopen] }
    MilestoneStatus:
      type: string
      enum: [planned, active, completed, cancelled]
    MilestoneCreate:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        target_date: { $ref: "#/components/schemas/LocalDate" }
        sort_order: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
    MilestonePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        status: { $ref: "#/components/schemas/MilestoneStatus" }
        target_date: { $ref: "#/components/schemas/LocalDate" }
        sort_order: { type: integer, minimum: 0, maximum: 1000000 }
    TaskStatus:
      type: string
      enum: [inbox, planned, in_progress, blocked, done, cancelled]
    NullableUuid:
      type: [string, "null"]
      format: uuid
    NullableDateTime:
      type: [string, "null"]
      format: date-time
    TaskCreate:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 240 }
        description: { type: string, maxLength: 20000, default: "" }
        priority: { type: string, enum: [low, normal, high, urgent], default: normal }
        due_at: { $ref: "#/components/schemas/NullableDateTime" }
        due_date: { $ref: "#/components/schemas/LocalDate" }
        milestone_id: { $ref: "#/components/schemas/NullableUuid" }
        parent_task_id: { $ref: "#/components/schemas/NullableUuid" }
    TaskPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 240 }
        description: { type: string, maxLength: 20000 }
        priority: { type: string, enum: [low, normal, high, urgent] }
        due_at: { $ref: "#/components/schemas/NullableDateTime" }
        due_date: { $ref: "#/components/schemas/LocalDate" }
        milestone_id: { $ref: "#/components/schemas/NullableUuid" }
        parent_task_id: { $ref: "#/components/schemas/NullableUuid" }
    TaskTransition:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [plan, start, block, complete, cancel, reopen] }
    DiscussionCreate:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
    DiscussionEntryCreate:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 20000 }
    DiscussionConversion:
      type: object
      additionalProperties: false
      required: [decision_title, statement, task_title]
      properties:
        decision_title: { type: string, minLength: 1, maxLength: 200 }
        statement: { type: string, minLength: 1, maxLength: 20000 }
        rationale: { type: string, maxLength: 20000, default: "" }
        task_title: { type: string, minLength: 1, maxLength: 240 }
        task_priority: { type: string, enum: [low, normal, high, urgent], default: normal }
        task_due_date: { $ref: "#/components/schemas/LocalDate" }
        milestone_id: { $ref: "#/components/schemas/NullableUuid" }
    CaptureCreate:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, space_id, title, body]
          properties:
            kind: { const: text }
            space_id: { type: string, format: uuid }
            project_id: { $ref: "#/components/schemas/NullableUuid" }
            title: { type: string, minLength: 1, maxLength: 200 }
            body: { type: string, minLength: 1, maxLength: 20000 }
        - type: object
          additionalProperties: false
          required: [kind, space_id, title, canonical_uri]
          properties:
            kind: { const: link }
            space_id: { type: string, format: uuid }
            project_id: { $ref: "#/components/schemas/NullableUuid" }
            title: { type: string, minLength: 1, maxLength: 200 }
            canonical_uri: { type: string, format: uri, maxLength: 2048, pattern: "^https?://" }
    CaptureTransition:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [process, archive, reopen] }
    DailyPlanSave:
      type: object
      additionalProperties: false
      required: [space_id, task_ids]
      properties:
        space_id: { type: string, format: uuid }
        task_ids:
          type: array
          maxItems: 3
          uniqueItems: true
          items: { type: string, format: uuid }
    DailyReviewSave:
      type: object
      additionalProperties: false
      required: [space_id]
      properties:
        space_id: { type: string, format: uuid }
        summary: { type: string, maxLength: 10000, default: "" }
        wins: { type: string, maxLength: 10000, default: "" }
        blockers: { type: string, maxLength: 10000, default: "" }
        next_focus: { type: string, maxLength: 10000, default: "" }
    MarkdownSourceImport:
      type: object
      additionalProperties: false
      required: [space_id, filename, content]
      properties:
        space_id: { type: string, format: uuid }
        project_id: { $ref: "#/components/schemas/NullableUuid" }
        filename:
          type: string
          minLength: 1
          maxLength: 180
          pattern: "^[^/\\\\\\x00-\\x1F\\x7F]+\\.(md|markdown)$"
        title: { type: string, minLength: 1, maxLength: 200 }
        content: { type: string, minLength: 1, maxLength: 1000000 }
    ContextSearch:
      type: object
      additionalProperties: false
      required: [space_id, q]
      properties:
        space_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        q: { type: string, minLength: 2, maxLength: 200 }
        types:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          default: [project, task, capture, document]
          items: { type: string, enum: [project, task, capture, document] }
        from: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        to: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        limit: { type: integer, minimum: 1, maximum: 50, default: 20 }
    ContextPackageCreate:
      type: object
      additionalProperties: false
      required: [space_id, name, purpose]
      properties:
        space_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        purpose: { type: string, minLength: 1, maxLength: 500 }
        expires_at: { type: [string, "null"], format: date-time, default: null }
    ContextPackageItemAdd:
      type: object
      additionalProperties: false
      required: [space_id, object_type, object_id]
      properties:
        space_id: { type: string, format: uuid }
        object_type: { type: string, enum: [project, task, capture, document] }
        object_id: { type: string, format: uuid }
        source_version_id: { $ref: "#/components/schemas/NullableUuid" }
        start_char: { type: [integer, "null"], minimum: 0, default: null }
        end_char: { type: [integer, "null"], minimum: 1, default: null }
    ContextPackageArchive:
      type: object
      additionalProperties: false
      required: [space_id, action]
      properties:
        space_id: { type: string, format: uuid }
        action: { const: archive }
    ContextCitationLocator:
      type: object
      additionalProperties: false
      required: [source_id, source_version_id, document_id, locator_type, start_char, end_char, text_sha256]
      properties:
        source_id: { type: string, format: uuid }
        source_version_id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        locator_type: { const: char_range }
        start_char: { type: integer, minimum: 0 }
        end_char: { type: integer, minimum: 1 }
        text_sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
    ContextCitationEligibility:
      type: object
      additionalProperties: false
      required: [eligible, kind, reason, locator]
      properties:
        eligible: { type: boolean }
        kind: { type: string, enum: [source_citation, object_locator, excluded] }
        reason: { type: [string, "null"] }
        locator:
          oneOf:
            - $ref: "#/components/schemas/ContextCitationLocator"
            - type: "null"
    ContextAnswerReadiness:
      type: object
      additionalProperties: false
      required: [state, generation_enabled, reason]
      properties:
        state: { type: string, enum: [citation_manifest_ready, refused_no_citable_evidence, package_expired, package_archived] }
        generation_enabled: { const: false }
        reason: { type: string }
    ContextPackageEvidence:
      type: object
      additionalProperties: false
      required: [citation_count, related_object_count, excluded_count, answer_readiness]
      properties:
        citation_count: { type: integer, minimum: 0 }
        related_object_count: { type: integer, minimum: 0 }
        excluded_count: { type: integer, minimum: 0 }
        answer_readiness: { $ref: "#/components/schemas/ContextAnswerReadiness" }
    ContextPackageResolved:
      type: object
      additionalProperties: true
      required: [items, evidence]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [citation]
            properties:
              citation: { $ref: "#/components/schemas/ContextCitationEligibility" }
        evidence: { $ref: "#/components/schemas/ContextPackageEvidence" }
    AnswerAttemptCreate:
      type: object
      additionalProperties: false
      required: [space_id, context_package_id, context_package_version, question]
      properties:
        space_id: { type: string, format: uuid }
        context_package_id: { type: string, format: uuid }
        context_package_version: { type: integer, minimum: 1 }
        question: { type: string, minLength: 2, maxLength: 1000 }
    AnswerDraftClaimInput:
      type: object
      additionalProperties: false
      required: [text, citation_ordinals]
      properties:
        text: { type: string, minLength: 1, maxLength: 1000 }
        citation_ordinals:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { type: integer, minimum: 1 }
    AnswerDraftValidationRequest:
      type: object
      additionalProperties: false
      required: [space_id, claims]
      properties:
        space_id: { type: string, format: uuid }
        claims:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/AnswerDraftClaimInput" }
    AnswerDraftClaimResult:
      type: object
      additionalProperties: false
      required: [ordinal, supported, reason_code, matched_citation_ordinal]
      properties:
        ordinal: { type: integer, minimum: 1 }
        supported: { type: boolean }
        reason_code: { type: string, enum: [EXACT_TEXT_FOUND, EXACT_TEXT_NOT_FOUND, CITATION_NOT_AVAILABLE] }
        matched_citation_ordinal: { type: [integer, "null"], minimum: 1 }
    AnswerDraftValidation:
      type: object
      additionalProperties: false
      required: [state, reason_code, reason, claim_count, supported_count, unsupported_count, semantic_entailment, persistence_enabled, generation_enabled, claims]
      properties:
        state: { type: string, enum: [passed, failed, blocked_refusal, blocked_integrity] }
        reason_code: { type: string, enum: [ALL_CLAIMS_EXACTLY_SUPPORTED, CLAIM_NOT_EXACTLY_SUPPORTED, ANSWER_ATTEMPT_REFUSED, CITATION_INTEGRITY_NOT_VERIFIED] }
        reason: { type: string }
        claim_count: { type: integer, minimum: 1, maximum: 20 }
        supported_count: { type: integer, minimum: 0, maximum: 20 }
        unsupported_count: { type: integer, minimum: 0, maximum: 20 }
        semantic_entailment: { const: false }
        persistence_enabled: { const: false }
        generation_enabled: { const: false }
        claims:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/AnswerDraftClaimResult" }
    AnswerAttemptCitation:
      type: object
      additionalProperties: false
      required: [id, ordinal, source_id, source_version_id, document_id, locator_type, start_char, end_char, text_sha256, integrity_state]
      properties:
        id: { type: string, format: uuid }
        ordinal: { type: integer, minimum: 1 }
        source_id: { type: string, format: uuid }
        source_version_id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        locator_type: { const: char_range }
        start_char: { type: integer, minimum: 0 }
        end_char: { type: integer, minimum: 1 }
        text_sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        integrity_state: { type: string, enum: [verified, source_unavailable, range_invalid, hash_mismatch] }
    AnswerAttemptIntegrity:
      type: object
      additionalProperties: false
      required: [state, verified_count, invalid_count, reason]
      properties:
        state: { type: string, enum: [verified, invalid, not_applicable] }
        verified_count: { type: integer, minimum: 0 }
        invalid_count: { type: integer, minimum: 0 }
        reason: { type: string }
    AnswerAttemptSafety:
      type: object
      additionalProperties: false
      required: [state, scope, reason_code, reason]
      properties:
        state: { type: string, enum: [passed, refused, not_applicable] }
        scope: { type: [string, "null"], enum: [question, evidence, null] }
        reason_code: { type: [string, "null"] }
        reason: { type: string }
    AnswerGenerationGate:
      type: object
      additionalProperties: false
      required: [state, reason_code, reason, available, runtime_id, profile_id]
      properties:
        state: { type: string, enum: [ready, blocked_refusal, blocked_integrity, blocked_model_unavailable] }
        reason_code: { type: [string, "null"], enum: [ANSWER_ATTEMPT_REFUSED, CITATION_INTEGRITY_NOT_VERIFIED, ANSWER_RUNTIME_UNAVAILABLE, null] }
        reason: { type: string }
        available: { type: boolean }
        runtime_id: { type: [string, "null"] }
        profile_id: { type: [string, "null"] }
    AnswerAttempt:
      type: object
      additionalProperties: false
      required:
        - id
        - space_id
        - context_package_id
        - context_package_version
        - context_digest
        - question
        - question_sha256
        - status
        - refusal_code
        - generation_enabled
        - citation_count
        - related_object_count
        - excluded_count
        - created_at
        - created_by
        - version
        - reason
        - citations
        - integrity
        - safety
        - generation_gate
      properties:
        id: { type: string, format: uuid }
        space_id: { type: string, format: uuid }
        context_package_id: { type: string, format: uuid }
        context_package_version: { type: integer, minimum: 1 }
        context_digest: { type: string, pattern: "^[a-f0-9]{64}$" }
        question: { type: string, minLength: 2, maxLength: 1000 }
        question_sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        status: { type: string, enum: [evidence_ready, refused_no_citable_evidence, refused_unsafe_intent] }
        refusal_code: { type: [string, "null"] }
        generation_enabled: { type: boolean }
        citation_count: { type: integer, minimum: 0 }
        related_object_count: { type: integer, minimum: 0 }
        excluded_count: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
        version: { const: 1 }
        reason: { type: string }
        citations:
          type: array
          items: { $ref: "#/components/schemas/AnswerAttemptCitation" }
        integrity: { $ref: "#/components/schemas/AnswerAttemptIntegrity" }
        safety: { $ref: "#/components/schemas/AnswerAttemptSafety" }
        generation_gate: { $ref: "#/components/schemas/AnswerGenerationGate" }
    FinalAnswer:
      type: object
      additionalProperties: true
      required: [id, answer_attempt_id, text, runtime_key, validation_status, claims, citations]
      properties:
        id: { type: string, format: uuid }
        answer_attempt_id: { type: string, format: uuid }
        text: { type: string, minLength: 1, maxLength: 30000 }
        runtime_key: { const: local-extractive-v1 }
        validation_status: { const: supported }
        claims:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [ordinal, text, claim_kind, entailment_status, reason_code]
            properties:
              ordinal: { type: integer, minimum: 1 }
              text: { type: string, minLength: 1, maxLength: 5000 }
              claim_kind: { type: string, enum: [direct_quote, inference] }
              entailment_status: { const: entailed }
              reason_code: { const: DIRECT_QUOTE_ENTAILED }
        citations:
          type: array
          minItems: 1
          items:
            type: object
            required: [ordinal, source_id, source_version_id, document_id, start_char, end_char, text_sha256, quote, integrity_state]
            properties:
              ordinal: { type: integer, minimum: 1 }
              source_id: { type: string, format: uuid }
              source_version_id: { type: string, format: uuid }
              document_id: { type: string, format: uuid }
              start_char: { type: integer, minimum: 0 }
              end_char: { type: integer, minimum: 1 }
              text_sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
              quote: { type: string }
              integrity_state: { type: string, enum: [verified, invalid] }
    SuccessEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, status, data, errors, meta]
      properties:
        request_id: { type: string, format: uuid }
        status: { const: ok }
        data: {}
        errors: { type: array, maxItems: 0 }
        meta:
          type: object
          required: [api_version]
          properties:
            api_version: { const: v1 }
          additionalProperties: true
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, status, data, errors, meta]
      properties:
        request_id: { type: string, format: uuid }
        status: { const: error }
        data: { type: "null" }
        errors:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [code, message, field, retryable]
            properties:
              code: { type: string }
              message: { type: string }
              field: { type: [string, "null"] }
              retryable: { type: boolean }
        meta:
          type: object
          required: [api_version]
          properties:
            api_version: { const: v1 }
          additionalProperties: true
