openapi: 3.1.0
info:
  title: Personal AI Workbench Local API
  version: 1.20.0
  description: >-
    Local-loopback MVP contract. It covers durable project work, explicit capture and daily
    planning, immutable controlled Markdown versions, authorization-first search, explicit
    ContextPackages, AnswerAttempt safety snapshots, and a local conservative Answer/Claim/Citation
    path that persists only direct quotes entailed by revalidated fixed ranges. It also covers the
    deterministic Native Run lifecycle, Task/Knowledge/Decision candidates, digest-bound L2
    approval, safe apply/revert, redacted governance audit reads, and verified local backup bundles
    with offline empty-directory restore. The professional workspace adds versioned research
    questions, experiments, exact-range evidence claims, AI opportunities, metric evaluations,
    explicit Go/Stop decisions, and optional follow-up tasks that remain in the original Project.
    The growth workspace adds manually curated frontier topics, exactly located source signals,
    explicit review dispositions, reusable learning tracks, practice feedback, and idempotent
    lightweight routine check-ins while retaining Project, Task, Source, permission, and audit truth.
    Open-ended inference, external actions, Harness/Hermes
    execution, and the default-off hybrid-search experiment remain outside the production path.
servers:
  - url: http://127.0.0.1:8787
paths:
  /api/health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Minimal service health without business data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /api/v1/session/bootstrap:
    post:
      operationId: bootstrapLocalSession
      parameters:
        - in: header
          name: X-Workbench-Bootstrap
          required: true
          schema: { type: string, minLength: 32 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/session:
    get:
      operationId: getLocalSession
      security: [{ localSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      operationId: revokeLocalSession
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/system/capabilities:
    get:
      operationId: getCapabilities
      security: [{ localSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/spaces:
    get:
      operationId: listSpaces
      security: [{ localSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/spaces/{spaceId}:
    get:
      operationId: getSpace
      security: [{ localSession: [] }]
      parameters:
        - in: path
          name: spaceId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/projects:
    get:
      operationId: listProjects
      security: [{ localSession: [] }]
      parameters:
        - in: query
          name: space_id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/ProjectStatus" }
        - in: query
          name: template_type
          schema: { $ref: "#/components/schemas/ProjectTemplate" }
        - in: query
          name: cursor
          schema: { type: string, maxLength: 512 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createProject
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectCreate" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}:
    get:
      operationId: getProject
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateProject
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectPatch" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProject
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/transitions:
    post:
      operationId: transitionProject
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectTransition" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/restore:
    post:
      operationId: restoreProject
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/milestones:
    get:
      operationId: listMilestones
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createMilestone
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MilestoneCreate" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/milestones/{milestoneId}:
    patch:
      operationId: updateMilestone
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/MilestoneId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MilestonePatch" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMilestone
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/MilestoneId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/tasks:
    get:
      operationId: listTasks
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createTask
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskCreate" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/tasks/{taskId}:
    get:
      operationId: getTask
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateTask
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskPatch" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteTask
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/tasks/{taskId}/transitions:
    post:
      operationId: transitionTask
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskTransition" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/discussions:
    get:
      operationId: listDiscussions
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createDiscussion
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscussionCreate" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/discussions/{discussionId}/entries:
    get:
      operationId: listDiscussionEntries
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/DiscussionId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createDiscussionEntry
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/DiscussionId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscussionEntryCreate" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/projects/{projectId}/decisions:
    get:
      operationId: listDecisions
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/discussions/{discussionId}/conversions:
    post:
      operationId: convertDiscussionToDecisionAndTask
      description: >-
        Explicit owner-confirmed atomic command. It resolves one open discussion,
        accepts one decision, creates one task, and records their link. It is not an AI approval.
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/DiscussionId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscussionConversion" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/captures:
    get:
      operationId: listCaptures
      security: [{ localSession: [] }]
      parameters:
        - in: query
          name: space_id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: project_id
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { type: string, enum: [inbox, processed, archived], default: inbox }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createCapture
      description: >-
        Stores explicit text or http/https link metadata in the local inbox.
        The endpoint never fetches the URL and never promotes the capture to long-term knowledge.
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaptureCreate" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/captures/{captureId}/transitions:
    post:
      operationId: transitionCapture
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CaptureId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaptureTransition" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/daily/{date}:
    get:
      operationId: getDailySnapshot
      description: >-
        Returns project task truth, at most three saved focus references, and the
        explicit user-authored review for one local date. It does not copy tasks or generate AI text.
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/DailyDate"
        - in: query
          name: space_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/daily-plans/{date}:
    put:
      operationId: saveDailyPlan
      description: Saves up to three references to project tasks; task records remain owned by the project workspace.
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/DailyDate"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/OptionalIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DailyPlanSave" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/daily-reviews/{date}:
    put:
      operationId: saveDailyReview
      description: Stores only the user's explicit review fields; no AI generation or silent rewriting occurs.
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/DailyDate"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/OptionalIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DailyReviewSave" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/sources:
    get:
      operationId: listSources
      description: Lists source metadata only after space/project authorization; storage paths and source bodies are not returned.
      security: [{ localSession: [] }]
      parameters:
        - in: query
          name: space_id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: project_id
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { type: string, enum: [ready, archived, failed], default: ready }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/sources/imports/markdown:
    post:
      operationId: importMarkdownSource
      description: >-
        Accepts one explicit Markdown payload from the browser, writes immutable content-addressed
        bytes under the controlled source root, creates Source/SourceVersion/Document, and indexes
        normalized text. It never accepts a client path, fetches a URL, invokes AI, or parses XLSX.
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkdownSourceImport" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/sources/{sourceId}/range:
    get:
      operationId: readSourceRange
      description: Re-authorizes and returns only one exact range from the current immutable SourceVersion; storage paths are never exposed.
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: sourceId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: space_id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: source_version_id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: start_char, required: true, schema: { type: integer, minimum: 0 } }
        - { in: query, name: end_char, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/sources/{sourceId}/versions:
    post:
      operationId: createMarkdownSourceVersion
      description: Creates a new immutable Markdown SourceVersion and atomically moves the searchable Document projection to it.
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: sourceId, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/sources/{sourceId}/transitions:
    post:
      operationId: transitionSource
      description: Archives or restores a controlled source without deleting its immutable versions.
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: sourceId, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/context/search:
    post:
      operationId: searchAuthorizedContext
      description: >-
        Read-only search command. Space/project/type/date authorization filters are applied in the
        database query before titles, snippets, counts, locators, or document text are returned or sent
        to a local sidecar. FTS5 trigram with a bounded short-query fallback remains the default. An
        explicitly enabled experimental path can add BGE-M3 stable-chunk dense ranking and RRF, with
        deterministic intent refusal, a synthetic-calibrated 0.50 evidence threshold, fixed model
        identity, exact SourceVersion character locators, and automatic FTS fallback. It never produces
        a generated answer and does not include reranking; the experimental feature remains default-off.
      security: [{ localSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContextSearch" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/context/packages:
    get:
      operationId: listContextPackages
      description: Lists active, expired, or archived package metadata in one authorized space; it does not resolve item bodies.
      security: [{ localSession: [] }]
      parameters:
        - in: query
          name: space_id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { type: string, enum: [active, expired, archived], default: active }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createContextPackage
      description: Creates an empty explicit allowlist with a declared purpose and optional UTC-normalized expiry.
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContextPackageCreate" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/context/packages/{packageId}:
    get:
      operationId: getContextPackage
      description: Resolves only explicit items that remain authorized and version-valid. Each item distinguishes a fixed-version source citation from an object locator; unavailable entries are excluded without body text. The evidence summary deterministically refuses factual-answer readiness when no citable source range exists and always reports generation_enabled=false.
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: packageId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: space_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Resolved context package with citation eligibility and answer readiness.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ContextPackageResolved" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/context/packages/{packageId}/items:
    post:
      operationId: addContextPackageItem
      description: Adds one authorized object or a fixed SourceVersion character range; no excerpt or body is persisted in the package item.
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: packageId, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContextPackageItemAdd" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/context/packages/{packageId}/items/{itemId}:
    delete:
      operationId: removeContextPackageItem
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: packageId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: itemId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: space_id, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/context/packages/{packageId}/transitions:
    post:
      operationId: archiveContextPackage
      description: Archives the package; archived packages resolve no body text for later runs.
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: packageId, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContextPackageArchive" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/context/answer-attempts:
    get:
      operationId: listAnswerAttempts
      description: Lists durable safety-check records for one authorized ContextPackage, including fixed citation references and their current read-time integrity state, but no excerpts or generated answer text. Any source, range, or hash drift is reported as invalid and must fail closed for downstream generation.
      security: [{ localSession: [] }]
      parameters:
        - { in: query, name: space_id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: context_package_id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAnswerAttempt
      description: >-
        Re-resolves the authorized ContextPackage at the exact client-observed version, applies a
        deterministic unsafe-intent gate, and persists either an evidence-ready citation-reference
        snapshot or an explicit refusal. The command is idempotent, audited, and does not generate an
        answer itself; generation_enabled reflects whether the approved local answer provider is configured.
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnswerAttemptCreate" }
      responses:
        "201":
          description: Durable evidence-ready or refusal attempt; use the separate generate command for an Answer.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AnswerAttempt" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/context/answer-attempts/{attemptId}:
    get:
      operationId: getAnswerAttempt
      description: Returns one authorized durable safety-check record and revalidates each fixed citation against its exact SourceVersion, Document, character range, and SHA-256. No source quote or generated answer text is included.
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: attemptId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: space_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: One answer-attempt safety record.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AnswerAttempt" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/context/answer-attempts/{attemptId}/validate-draft:
    post:
      operationId: validateAnswerDraft
      description: >-
        Re-authorizes an evidence-ready AnswerAttempt, revalidates every fixed citation, and
        checks whether each candidate sentence occurs verbatim inside at least one explicitly
        referenced citation range. This is a non-persistent extractive preflight, not semantic
        entailment, factual verification, answer generation, or creation of Answer/Citation truth.
        Candidate text and source excerpts are never returned or stored.
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: attemptId, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnswerDraftValidationRequest" }
      responses:
        "200":
          description: Extractive preflight result or a fail-closed refusal/integrity block; no candidate or source text.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AnswerDraftValidation" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/context/answer-attempts/{attemptId}/answer:
    get:
      operationId: getFinalAnswer
      description: Returns the immutable validated Answer, its claim verdicts and final SourceVersion character-range citations, or null before generation.
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: attemptId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: space_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/context/answer-attempts/{attemptId}/generate:
    post:
      operationId: generateFinalAnswer
      description: Uses the approved local conservative runtime and persists an Answer only when every direct-quote claim is entailed by its revalidated fixed citation range.
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: attemptId, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [space_id]
              properties:
                space_id: { type: string, format: uuid }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/runtimes:
    get:
      operationId: listRuntimes
      description: Lists the implemented Native adapter, disconnected Harness protocol-preflight metadata, and the disconnected Hermes candidate without probing either external runtime.
      security: [{ localSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v1/runtimes/{runtimeKey}/health:
    get:
      operationId: getRuntimeHealth
      description: Returns a redacted health snapshot only for an available adapter; disconnected candidates return RUNTIME_UNAVAILABLE.
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: runtimeKey, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/runs:
    get:
      operationId: listAgentRuns
      description: Lists safe run metadata inside one authorized space.
      security: [{ localSession: [] }]
      parameters:
        - { in: query, name: space_id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { type: string, enum: [queued, running, succeeded, failed, cancelled] } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAgentRun
      description: Starts the deterministic local Native lifecycle against one active, version-matched ContextPackage. It produces no model answer; an explicitly supplied Task Candidate may use the single registered L1 candidate tool.
      security: [{ localSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentRunCreate" }
      responses:
        "202": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/runs/{runId}:
    get:
      operationId: getAgentRun
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: runId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: space_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/runs/{runId}/events:
    get:
      operationId: replayAgentRunEvents
      description: Returns a bounded JSON replay page after a sequence number.
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: runId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: space_id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: after_seq, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/runs/{runId}/events/stream:
    get:
      operationId: streamAgentRunEvents
      description: Streams authorized, redacted Run events as SSE and resumes after Last-Event-ID; disconnecting never cancels the Run.
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: runId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: space_id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: after_seq, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
        - { in: header, name: Last-Event-ID, required: false, schema: { type: string, pattern: "^[0-9]+$" } }
      responses:
        "200":
          description: Recoverable event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/runs/{runId}/checkpoints:
    get:
      operationId: listAgentRunCheckpoints
      description: Lists Workbench-verifiable checkpoints without prompt text, secrets, or Runtime-private state bodies.
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: runId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: space_id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: after_seq, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/runs/{runId}/cancel:
    post:
      operationId: cancelAgentRun
      description: Idempotently cancels a non-terminal Native run using optimistic versioning.
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: runId, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentRunCancel" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/runs/{runId}/retry:
    post:
      operationId: retryAgentRun
      description: Creates one linked Run only when the failed source is explicitly retryable, used no tools, and its ContextPackage version remains active.
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: runId, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentRunRetry" }
      responses:
        "202": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/tools:
    get:
      operationId: listRegisteredTools
      description: Lists the fixed local Tool Gateway allowlist and action levels; it exposes no executable credentials or dynamic installation.
      security: [{ localSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v1/candidates:
    get:
      operationId: listCandidates
      description: Lists non-authoritative candidates inside one authorized space.
      security: [{ localSession: [] }]
      parameters:
        - { in: query, name: space_id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { type: string, enum: [pending, approved, rejected, applied, failed, reverted] } }
        - { in: query, name: candidate_type, schema: { type: string, enum: [task, knowledge, decision] } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/candidates/{candidateId}:
    get:
      operationId: getCandidate
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: candidateId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: space_id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/candidates/{candidateId}/approvals:
    post:
      operationId: requestCandidateApproval
      description: Creates one expiring L2 approval bound to the typed proposal digest; it does not apply the candidate.
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: candidateId, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CandidateApprovalRequest" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/candidates/{candidateId}/apply:
    post:
      operationId: applyCandidate
      description: Revalidates candidate bytes, approval scope, expiry, space, project state and candidate version before creating one local task, knowledge item, or decision.
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: candidateId, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CandidateApply" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/candidates/{candidateId}/revert:
    post:
      operationId: revertCandidate
      description: Soft-deletes a just-applied local object only while its version and downstream relationship set remain unchanged.
      security: [{ localSession: [] }]
      parameters:
        - { in: path, name: candidateId, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/governance/audit-events:
    get:
      operationId: listGovernanceAuditEvents
      description: Returns authorized low-sensitive audit metadata without candidate bodies, source excerpts, credentials, or storage paths.
      security: [{ localSession: [] }]
      parameters:
        - { in: query, name: space_id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: action, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/v1/approvals:
    get:
      operationId: listApprovals
