user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # PC / Mobile detection based on User-Agent
    map $http_user_agent $is_mobile {
        default       0;
        "~*Mobile|Android|Silk|Kindle|BlackBerry|Opera Mini|Opera Mobi" 1;
    }

    # Upstream services
    upstream pc_app {
        server pc:80;
    }

    upstream mobile_app {
        server mobile:80;
    }

    upstream api_server {
        server api:8000;
    }

    # www.example.com or general
    server {
        listen       80;
        server_name  localhost www.example.com;

        # Forward API requests
        location /api/ {
            proxy_pass http://api_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health check
        location /healthz {
            proxy_pass http://api_server;
        }

        # Mobile redirect if accessing www from mobile
        location / {
            if ($is_mobile) {
                return 302 http://m.example.com$request_uri;
            }
            proxy_pass http://pc_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # m.example.com
    server {
        listen       80;
        server_name  m.example.com;

        # Forward API requests
        location /api/ {
            proxy_pass http://api_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /healthz {
            proxy_pass http://api_server;
        }

        # PC redirect if accessing m. from PC
        location / {
            if ($is_mobile = 0) {
                return 302 http://www.example.com$request_uri;
            }
            proxy_pass http://mobile_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
