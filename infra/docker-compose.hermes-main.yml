# Hermes Main Agent — Docker Compose 配置
# 运行环境：WSL2 + Docker Desktop (Windows)
# 功能：将百度云盘同步目录 E:\BaiduSyncdisk\DDUP 映射到容器内 /opt/ddup

services:
  hermes-main:
    image: hermes:latest
    container_name: hermes-main
    restart: unless-stopped

    environment:
      # 实例标识
      HERMES_INSTANCE_ID: hermes-main
      # DDUP 共享库路径（容器内）
      DDUP_PATH: /opt/ddup
      # MinIO 存储
      MINIO_ENDPOINT: 192.168.102.204:9000
      MINIO_BUCKET: ddup-shared-library
      MINIO_ACCESS_KEY: ddup_admin
      MINIO_SECRET_KEY: ddup_shared_2026!
      # Wiki 路径
      OBSIDIAN_VAULT_PATH: /opt/ddup/wiki-vault

    volumes:
      # 原有数据卷（会话历史、skills 缓存等）
      - hermes-data:/opt/data
      # D 盘映射（配置、.hermes 目录）
      - D:\:/root/.hermes
      # E 盘百度云盘同步目录 → 容器内共享库（读写）
      - /mnt/e/BaiduSyncdisk/DDUP:/opt/ddup:rw

    # 如需直接访问宿主机网络（如本地 MinIO、飞书 webhook 调试）
    # network_mode: host
    # 或暴露特定端口
    ports:
      - "8080:8080"

    # 确保容器内中文正常显示
    stdin_open: true
    tty: true

volumes:
  hermes-data:
    driver: local
