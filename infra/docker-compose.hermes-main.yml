# Hermes Main Agent — Docker Compose 配置
# 运行环境：WSL2 + Docker Desktop (Windows)
# 功能：将百度云盘同步目录 E:\BaiduSyncdisk\DDUP 映射到容器内 /opt/ddup

services:
  hermes-main:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-main
    restart: unless-stopped
    command: ["gateway", "run", "-v"]

    env_file:
      - .env.hermes-main.example

    environment:
      # 实例标识
      HERMES_INSTANCE_ID: hermes-main
      # DDUP 共享库路径（容器内）
      DDUP_PATH: /opt/ddup
      # Wiki 路径
      OBSIDIAN_VAULT_PATH: /opt/ddup/wiki-vault

    volumes:
      - ${HERMES_DATA_HOST_PATH:-hermes-data}:/opt/data
      - ${DDUP_HOST_PATH:-/mnt/e/BaiduSyncdisk/DDUP}:/opt/ddup:rw

    # 如需直接访问宿主机网络（如本地 MinIO、飞书 webhook 调试）
    # network_mode: host
    # 或暴露特定端口
    ports:
      - "8080:8080"

    # 确保容器内中文正常显示
    stdin_open: true
    tty: true

volumes:
  hermes-data:
    driver: local
