services:
  api:
    build:
      context: ../apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      DDUP_WIKI_ENABLED: ${DDUP_WIKI_ENABLED:-true}
      DDUP_WIKI_VAULT_PATH: ${DDUP_WIKI_VAULT_PATH:-/opt/ddup/wiki-vault}
      DDUP_WIKI_RAW_DIR: ${DDUP_WIKI_RAW_DIR:-_raw}
      HERMES_API_BASE: ${HERMES_API_BASE:-}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      HERMES_MODEL: ${HERMES_MODEL:-hermes-agent}
    volumes:
      - ${DDUP_WIKI_VAULT_PATH:-/opt/ddup/wiki-vault}:${DDUP_WIKI_VAULT_PATH:-/opt/ddup/wiki-vault}
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  pc:
    build:
      context: ..
      dockerfile: apps/pc/Dockerfile
    depends_on:
      - api

  mobile:
    build:
      context: ..
      dockerfile: apps/mobile/Dockerfile
    depends_on:
      - api

  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - pc
      - mobile
      - api

