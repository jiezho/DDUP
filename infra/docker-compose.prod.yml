services:
  api:
    build:
      context: ../apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      DDUP_PATH: ${DDUP_PATH:-/opt/ddup}
      DDUP_WIKI_ENABLED: ${DDUP_WIKI_ENABLED:-true}
      DDUP_WIKI_VAULT_PATH: ${DDUP_WIKI_VAULT_PATH:-/opt/ddup/wiki-vault}
      DDUP_WIKI_RAW_DIR: ${DDUP_WIKI_RAW_DIR:-_raw}
      HERMES_API_BASE: ${HERMES_API_BASE:-}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      HERMES_MODEL: ${HERMES_MODEL:-hermes-agent}
      # MinIO storage
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:9000}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-ddup-shared-library}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_SECURE: ${STORAGE_SECURE:-false}
    volumes:
      - ${DDUP_WIKI_VAULT_PATH:-/opt/ddup/wiki-vault}:${DDUP_WIKI_VAULT_PATH:-/opt/ddup/wiki-vault}
      - ../shared-library:${DDUP_PATH:-/opt/ddup}/shared-library
      - ../agents:${DDUP_PATH:-/opt/ddup}/agents
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - minio

  pc:
    build:
      context: ..
      dockerfile: apps/pc/Dockerfile
    depends_on:
      - api

  mobile:
    build:
      context: ..
      dockerfile: apps/mobile/Dockerfile
    depends_on:
      - api

  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - pc
      - mobile
      - api

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-}
    volumes:
      - ${MINIO_DATA_DIR:-/opt/minio/data}:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
