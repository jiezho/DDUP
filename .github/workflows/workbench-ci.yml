name: Workbench CI

on:
  push:
    paths:
      - "person_dashboard-main/Workbench/**"
      - ".github/workflows/workbench-ci.yml"
  pull_request:
    paths:
      - "person_dashboard-main/Workbench/**"
      - ".github/workflows/workbench-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    defaults:
      run:
        working-directory: person_dashboard-main/Workbench

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The rollback test loads the pinned, actual v13 storage modules.
          fetch-depth: 0

      - name: Use Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: person_dashboard-main/Workbench/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=high

      - name: Check runtime and SQLite capabilities
        run: npm run check:runtime

      - name: Run SQLite quick reliability spike
        run: npm run spike:sqlite

      - name: Build and run tests
        run: npm test

      - name: Scan privacy boundary
        run: npm run privacy:scan

  sqlite-full:
    name: SQLite full / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    defaults:
      run:
        working-directory: person_dashboard-main/Workbench
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: person_dashboard-main/Workbench/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run 100k object / 1m relation SQLite reliability gate
        run: npm run spike:sqlite:full

  browser-matrix:
    name: Browser / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
    defaults:
      run:
        working-directory: person_dashboard-main/Workbench
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: person_dashboard-main/Workbench/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Install selected browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build production PWA shell
        run: npm run build
      - name: Run responsive, keyboard and offline acceptance
        run: npm run test:e2e
        env:
          WORKBENCH_E2E_BROWSER: ${{ matrix.browser }}
      - name: Verify production PWA offline boundary
        run: npm run test:pwa
        env:
          WORKBENCH_E2E_BROWSER: ${{ matrix.browser }}
